<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>evcc-rs scenarios</title>
<style>
  :root {
    --bg: #eff1ee; --panel: #ffffff; --text: #1f2933; --muted: #66727f; --line: #dde2e8; --line-strong: #c5ccd5;
    --accent: #2457c5; --accent-hover: #1c47a3; --accent-text: #ffffff; --accent-soft: #e4ebfa; --hover: #eef1f4; --set: #fff1c9;
    --ok: #23844a; --bad: #c0392b; --warn: #b7791f; --charge: #23844a; --discharge: #d9730d;
    --log-bg: #1b222b; --log-text: #d8dde3; --input: #ffffff; --shadow: none;
    --body-hi: #5b95f5; --body: #2d6cdf; --body2: #1a3f93; --sky: #e9eff6; --sky2: #c9d8ea; --ground: #b9c0c9; --ground2: #d3d8de; --live: #e0a526; --metal: #66727f;
    --radius: 8px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #14181d; --panel: #1c222a; --text: #dde2e8; --muted: #8f9ba8; --line: #2c3541; --line-strong: #3b4756;
      --accent: #7ea6f5; --accent-hover: #9bbbf8; --accent-text: #0b1830; --accent-soft: #1d2a45; --hover: #252d38; --set: #4a3f1c;
      --ok: #6fcf8e; --bad: #ec8a7f; --warn: #e8b660; --charge: #6fcf8e; --discharge: #f0a050;
      --log-bg: #0f1318; --log-text: #cdd3da; --input: #151a20; --shadow: none; --body-hi: #c3d7ff; --body: #8fb4ff; --body2: #4d73c4; --sky: #222b36; --sky2: #1a212b; --ground: #2a323c; --ground2: #1f262e; --live: #f0c040; --metal: #8f9ba8; color-scheme: dark;
    }
  }
  :root[data-theme=dark] {
    --bg: #14181d; --panel: #1c222a; --text: #dde2e8; --muted: #8f9ba8; --line: #2c3541; --line-strong: #3b4756;
    --accent: #7ea6f5; --accent-hover: #9bbbf8; --accent-text: #0b1830; --accent-soft: #1d2a45; --hover: #252d38; --set: #4a3f1c;
    --ok: #6fcf8e; --bad: #ec8a7f; --warn: #e8b660; --charge: #6fcf8e; --discharge: #f0a050;
    --log-bg: #0f1318; --log-text: #cdd3da; --input: #151a20; --shadow: none; --body-hi: #c3d7ff; --body: #8fb4ff; --body2: #4d73c4; --sky: #222b36; --sky2: #1a212b; --ground: #2a323c; --ground2: #1f262e; --live: #f0c040; --metal: #8f9ba8; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; gap: 1.2rem; align-items: center; padding: .5rem 1.2rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; display: flex; align-items: center; gap: .45rem; letter-spacing: .01em; }
  header h1 svg { width: 1.3rem; height: 1.3rem; color: var(--accent); }
  header .tabs { display: flex; gap: .2rem; flex: 1; align-self: stretch; }
  header .tabs button { background: none; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: .3rem .9rem; font-weight: 500; }
  header .tabs button:hover { color: var(--text); background: none; }
  header .tabs button.current { color: var(--accent); border-bottom-color: var(--accent); background: none; }
  header .theme { background: none; color: var(--muted); border-color: var(--line); padding: .25rem .7rem; }
  .split { display: grid; grid-template-columns: 16rem 1fr; min-height: 0; }
  nav { border-right: 1px solid var(--line); overflow: auto; padding: .7rem; background: var(--panel); }
  nav h1 { font-size: .85rem; font-weight: 600; color: var(--muted); margin: .2rem .5rem .6rem; }
  nav a { display: block; padding: .3rem .5rem; border-radius: 6px; color: inherit; text-decoration: none; cursor: pointer; }
  nav a:hover { background: var(--hover); }
  nav a.current { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main, #sim-view { min-height: 0; overflow: auto; padding: 1.1rem 1.3rem 2rem; display: grid; gap: 1rem; align-content: start; }
  h2 { font-size: 1.2rem; margin: 0; }
  p.desc { margin: .2rem 0 0; color: var(--muted); }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
  label { display: grid; gap: .15rem; font-size: .85rem; }
  label.inline { display: flex; gap: .4rem; align-items: center; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .three { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 1rem; align-items: start; }
  .columns.wide { grid-template-columns: 3fr 2fr; }
  @media (max-width: 1100px) { .columns, .columns.wide { grid-template-columns: 1fr; } }
  fieldset, .panel { border: 1px solid var(--line); border-radius: var(--radius); padding: .7rem .9rem; background: var(--panel); margin: 0; min-width: 0; box-shadow: var(--shadow); }
  fieldset fieldset { margin: .4rem 0; box-shadow: none; }
  legend, .panel h3 { font-weight: 600; font-size: .95rem; margin: 0 0 .4rem; }
  .panel h3 small { font-weight: 400; color: var(--muted); margin-left: .4rem; font-size: .78rem; }
  .field { display: grid; grid-template-columns: 13rem 1fr auto; gap: .4rem; align-items: center; padding: .12rem 0; }
  .field .name { font-family: ui-monospace, monospace; font-size: .8rem; overflow-wrap: anywhere; }
  .field .doc { grid-column: 2 / 4; color: var(--muted); font-size: .75rem; margin-top: -.1rem; }
  input[type=text], input[type=number], select, textarea { width: 100%; padding: .3rem .5rem; border: 1px solid var(--line-strong); border-radius: 6px; font: inherit; background: var(--input); color: var(--text); }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=checkbox] { accent-color: var(--accent); }
  textarea { font-family: ui-monospace, monospace; font-size: .8rem; }
  .set input, .set select, .set textarea, input.set { background: var(--set); }
  button { padding: .4rem 1rem; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); border-radius: 6px; cursor: pointer; font: inherit; font-weight: 500; }
  button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .45; cursor: default; }
  button.reset { padding: 0 .4rem; background: none; color: var(--accent); border-color: transparent; }
  button.quiet { background: none; color: var(--text); border-color: var(--line-strong); }
  button.quiet:hover:not(:disabled) { background: var(--hover); border-color: var(--line-strong); }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.big { padding: .5rem 1.3rem; font-size: 1rem; font-weight: 600; border-radius: 8px; white-space: nowrap; }
  #verdict { font-weight: 600; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .8rem; }
  .pass { color: var(--ok); } .fail, .error { color: var(--bad); }
  .logs { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .log h3 { margin: 0 0 .2rem; font-size: .85rem; font-family: ui-monospace, monospace; }
  .log pre { margin: 0; height: 22rem; overflow: auto; background: var(--log-bg); color: var(--log-text); padding: .6rem; border-radius: 8px; font-size: .75rem; white-space: pre-wrap; }
  details > summary { cursor: pointer; color: var(--muted); font-weight: 500; padding: .15rem 0; user-select: none; }
  details > summary:hover { color: var(--text); }
  details[open] > summary { margin-bottom: .5rem; }
  details pre { background: var(--hover); padding: .5rem; overflow: auto; font-size: .75rem; border-radius: 6px; }
  /* simulation: control bar */
  .bar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  .bar .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; color: var(--text); border: 0; border-right: 1px solid var(--line-strong); border-radius: 0; padding: .4rem .7rem; font-weight: 500; white-space: nowrap; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover:not(:disabled) { background: var(--hover); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .seg button:disabled { opacity: .6; }
  .seg button.on:disabled { opacity: .85; }
  .pill { display: inline-flex; align-items: center; gap: .4rem; padding: .2rem .7rem; border-radius: 999px; background: var(--hover); color: var(--muted); font-size: .82rem; font-weight: 500; }
  .pill::before { content: ""; width: .5rem; height: .5rem; border-radius: 50%; background: var(--line-strong); }
  .pill.live { color: var(--ok); } .pill.live::before { background: var(--ok); }
  .pill.busy { color: var(--warn); } .pill.busy::before { background: var(--warn); }
  .presets { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .presets .label { color: var(--muted); font-size: .8rem; margin-right: .2rem; }
  .chip { padding: .25rem .8rem; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--panel); color: var(--text); font-size: .82rem; font-weight: 500; }
  .chip:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  /* live readouts */
  .tiles { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr 1.2fr; border-top: 2px solid var(--text); border-bottom: 1px solid var(--line-strong); }
  @media (max-width: 900px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile { padding: .7rem 1rem .8rem; display: grid; gap: .05rem; align-content: start; border-left: 1px solid var(--line); }
  .tile:first-child { border-left: 0; padding-left: .2rem; }
  .tile .k { color: var(--muted); font-size: .8rem; }
  .tile .v { font: 600 2rem/1.1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile .v small { font: 500 .85rem system-ui, sans-serif; color: var(--muted); margin-left: .25rem; letter-spacing: 0; }
  .tile .sub { color: var(--muted); font-size: .8rem; min-height: 1.2em; }
  .tile.hero .v { font-size: 2.6rem; }
  .tile.charging .v, .tile.charging .sub { color: var(--charge); }
  .tile.discharging .v, .tile.discharging .sub { color: var(--discharge); }
  .tile.phase .v { font: 600 1.15rem/1.3 system-ui, sans-serif; letter-spacing: 0; }
  .flow { height: .35rem; margin-top: .4rem; background: var(--hover); position: relative; border-radius: 2px; }
  .flow::after { content: ""; position: absolute; top: -.2rem; bottom: -.2rem; left: 50%; width: 1px; background: var(--line-strong); }
  .flow > i { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--charge); transition: left .3s, width .3s; }
  .tile.discharging .flow > i { background: var(--discharge); }
  .meter { height: .35rem; border-radius: 2px; background: var(--hover); overflow: hidden; margin-top: .4rem; }
  .meter > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  /* stepper */
  .stepper { display: flex; flex-wrap: wrap; gap: .35rem; }
  .stepper button { padding: .25rem .7rem; border: 1px solid var(--line-strong); border-radius: 999px; font-size: .8rem; color: var(--muted); background: var(--panel); font-weight: 500; }
  .stepper button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .stepper button:disabled { opacity: 1; cursor: default; }
  .stepper button.done { color: var(--text); border-color: var(--accent); }
  .stepper button.current { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .stepper button.held { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 45%, transparent); }
  /* value tables */
  table.values { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.values th { text-align: left; font-weight: 500; color: var(--muted); font-size: .75rem; padding: 0 .3rem .25rem 0; }
  table.values td { padding: .15rem .3rem .15rem 0; vertical-align: middle; }
  table.values td.name { font-size: .84rem; }
  table.values td.name .u { color: var(--muted); font-size: .75rem; margin-left: .25rem; }
  table.values td.name .hint { cursor: help; }
  table.values tr.group td { padding-top: .7rem; color: var(--text); font-size: .82rem; font-weight: 600; border-bottom: 1px solid var(--line); }
  table.values td.used input { color: var(--muted); font-variant-numeric: tabular-nums; }
  table.values td.used input:not(:disabled) { color: var(--text); }
  table.values td.used input.pending { outline: 1px solid var(--warn); }
  table.values input[type=number] { width: 7rem; padding: .15rem .4rem; }
  table.values td.name { width: 52%; }
  table.values.hide-used .used { display: none; }
  .chips { display: flex; gap: .5rem 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  .chips b { color: var(--text); font-weight: 600; }
  .note { color: var(--muted); font-size: .8rem; margin: .3rem 0 0; }
  .row.tight { gap: .5rem; margin: .35rem 0; align-items: center; }
  .faults { display: grid; gap: .8rem; }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem .4rem; margin-top: .6rem; font-size: .78rem; }
  .legend label { display: inline-flex; gap: .35rem; align-items: center; padding: .15rem .6rem .15rem .45rem; border: 1px solid var(--line-strong); border-radius: 999px; cursor: pointer; color: var(--muted); }
  .legend label.on { color: var(--text); background: var(--hover); }
  .legend label input { display: none; }
  .legend b { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3rem; display: inline-block; }
  .swatch { width: .7rem; height: .7rem; border-radius: 50%; display: inline-block; opacity: .35; }
  .legend label.on .swatch { opacity: 1; }
  .timeline { display: grid; grid-template-columns: 2fr 1fr; gap: .6rem; margin-top: .4rem; }
  .tl-scroll { max-height: 18rem; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  .tl-scroll thead th { position: sticky; top: 0; background: var(--panel); }
  .tl-scroll tbody tr { cursor: pointer; }
  .tl-scroll tbody tr:hover { background: var(--hover); }
  .tl-scroll tr.muted td { color: var(--muted); }
  .tl-scroll tr.bad td { color: var(--bad); }
  .tl-scroll td { white-space: nowrap; font-size: .78rem; padding: .08rem .4rem; }
  #timeline-detail { margin: 0; max-height: 18rem; overflow: auto; background: var(--hover); padding: .5rem; border-radius: 6px; font-size: .72rem; }
  /* simulation: a fixed top (picture, readouts, status, start), tabs, and the tab's panes below */
  #sim-view { padding: 0; overflow: hidden; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 0; align-content: stretch; }
  .simtop { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .4rem 1.1rem; align-items: center; padding: .55rem 1.2rem; background: var(--panel); }
  @media (max-width: 1000px) { .simtop { grid-template-columns: auto 1fr; } .simtop .tiles { grid-column: 1 / -1; order: 3; } }
  .sceneview { width: 14rem; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--sky); }
  .sceneview svg.scene3d { display: block; width: 100%; height: auto; }
  .sceneview .cap { display: block; padding: .15rem .5rem; font-size: .7rem; color: var(--muted); background: var(--panel); border-top: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sceneview.arrive .veh { animation: arrive 1.8s ease-out; }
  @keyframes arrive { from { transform: translate(var(--ax), var(--ay)); } to { transform: none; } }
  .sceneview .draw { fill: none; stroke: var(--metal); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .9s ease-in-out; }
  .sceneview .raise, .sceneview .lower { transform: scaleY(.06); transition: transform .9s ease-in-out; }
  .sceneview .flow { stroke: var(--live); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 2 12; fill: none; opacity: 0; transition: opacity .4s; }
  .sceneview[data-link="1"] .draw { stroke-dashoffset: 0; }
  .sceneview[data-link="1"] .raise, .sceneview[data-link="1"] .lower { transform: none; }
  .sceneview[data-flow="1"] .flow { opacity: 1; animation: flow-run .6s linear infinite; }
  @keyframes flow-run { to { stroke-dashoffset: -14; } }
  @media (prefers-reduced-motion: reduce) { .sceneview * { animation: none !important; transition: none !important; } }
  .simtop .tiles { border-top-width: 1px; }
  .simtop .tile { padding: .3rem .8rem .35rem; }
  .simtop .tile .v { font-size: 1.35rem; }
  .simtop .tile.hero .v { font-size: 1.8rem; }
  .simtop .tile .sub { font-size: .72rem; min-height: 1em; }
  .simtop .tile.phase .v { font-size: 1rem; }
  .simctl { display: grid; gap: .4rem; justify-items: stretch; min-width: 11rem; }
  .simctl .btns { display: flex; gap: .4rem; }
  .simctl .btns button { flex: 1; padding: .3rem .5rem; font-size: .82rem; }
  .simctl .pill { justify-self: start; }
  .simctl .error { font-size: .75rem; }
  .subtabs { display: flex; gap: .15rem; padding: 0 1.2rem; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .subtabs button { background: none; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: .45rem .9rem; font-weight: 500; white-space: nowrap; }
  .subtabs button:hover:not(:disabled) { background: none; color: var(--text); border-color: transparent; border-bottom-color: var(--line-strong); }
  .subtabs button.current, .subtabs button.current:hover:not(:disabled) { color: var(--accent); border-bottom-color: var(--accent); }
  .tabbody { overflow: auto; min-height: 0; padding: 1rem 1.3rem 2rem; }
  .pane { display: grid; gap: 1rem; align-content: start; }
  .setup { display: grid; grid-template-columns: minmax(16rem, 21rem) minmax(0, 1fr); gap: 1rem; align-items: start; }
  @media (max-width: 1000px) { .setup { grid-template-columns: 1fr; } }
  .stack { display: grid; gap: .55rem; }
  .stack .label { color: var(--muted); font-size: .78rem; margin-bottom: -.25rem; }
  .stack .seg { display: flex; }
  .stack .seg button { flex: 1; padding: .35rem .4rem; font-size: .85rem; white-space: normal; line-height: 1.2; }
  .faults select { width: auto; max-width: 22rem; }
  .stack .opts { display: flex; flex-wrap: wrap; gap: .4rem 1rem; }
</style>

<body>
<header>
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0V7zM12 17v5"/></svg>evcc-rs</h1>
  <div class="tabs"><button id="tab-scenarios" class="current" type="button">Scenarios</button><button id="tab-sim" type="button">Simulation</button></div>
  <button id="theme" class="theme" type="button" title="colour theme">auto</button>
</header>
<div class="split" id="scenarios-view">
  <nav><h1>Scenarios</h1><div id="list"></div></nav>
  <main id="main"><p>Pick a scenario.</p></main>
</div>
<div id="sim-view" hidden></div>
<script>
"use strict";
const $ = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("data-")) e.setAttribute(k, v); else e[k] = v;
  }
  for (const k of kids) e.append(k);
  return e;
};
const api = async (url, init) => {
  const r = await fetch(url, init);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
};

let schemas, scenario, running = false;

// ---- schema helpers ------------------------------------------------------

const deref = (root, s) => {
  while (s && s.$ref) s = s.$ref.slice(2).split("/").reduce((o, k) => o[k], root);
  return s || {};
};
// The type of a schema without "null", and whether null is allowed.
const strip = (root, s) => {
  s = deref(root, s);
  if (Array.isArray(s.type)) {
    const types = s.type.filter(t => t !== "null");
    s = { ...s, type: types.length === 1 ? types[0] : types };
  }
  if (s.anyOf || s.oneOf) {
    const alts = (s.anyOf || s.oneOf).map(a => deref(root, a)).filter(a => a.type !== "null");
    if (alts.length === 1) s = { ...s, ...alts[0] };
    else if (alts.every(a => "const" in a || a.enum)) {
      s = { ...s, enum: alts.flatMap(a => ("const" in a ? [a.const] : a.enum)) };
    }
  }
  return s;
};

// ---- values by path ------------------------------------------------------

const getPath = (obj, path) => path.reduce((o, k) => (o == null ? undefined : o[k]), obj);
const setPath = (obj, path, value) => {
  const chain = [obj];
  for (const k of path.slice(0, -1)) {
    if (chain.at(-1)[k] == null) {
      if (value === undefined) return;
      chain.at(-1)[k] = {};
    }
    chain.push(chain.at(-1)[k]);
  }
  const last = path.at(-1);
  if (value === undefined) delete chain.at(-1)[last]; else chain.at(-1)[last] = value;
  // Prune tables that became empty.
  for (let i = chain.length - 1; i > 0; i--) if (Object.keys(chain[i]).length === 0) delete chain[i - 1][path[i - 1]];
};

// ---- forms made from the schema ------------------------------------------

function form(root, schema, settings, defaults, path = [], hook = refresh, omit = []) {
  const props = strip(root, schema).properties || {};
  const box = $("div");
  for (const [name, raw] of Object.entries(props)) {
    if (!path.length && omit.includes(name)) continue;
    const s = strip(root, raw);
    const here = [...path, name];
    if (s.type === "object" && s.properties) {
      box.append($("fieldset", {}, $("legend", { textContent: name }), form(root, s, settings, defaults, here, hook, omit)));
      continue;
    }
    const row = field(root, name, raw, s, here, settings, defaults, hook);
    const need = name.startsWith("ac_") ? (name.includes("discharge") ? "ac bpt" : "ac") : name.includes("discharge") ? "bpt" : "";
    if (need) row.dataset.need = need;
    box.append(row);
  }
  return box;
}

function field(root, name, raw, s, here, settings, defaults, hook) {
  const row = $("div", { className: "field" });
  const dflt = getPath(defaults, here);
  const set = () => getPath(settings, here) !== undefined;
  const value = () => (set() ? getPath(settings, here) : dflt);
  const mark = () => { row.classList.toggle("set", set()); reset.hidden = !set(); };
  const reset = $("button", { className: "reset", title: "back to the default", textContent: "×", type: "button" });
  const put = v => { setPath(settings, here, v); mark(); hook(); };
  let input;
  if (s.type === "boolean") {
    input = $("input", { type: "checkbox", checked: !!value() });
    input.onchange = () => put(input.checked);
  } else if (s.enum) {
    input = $("select");
    for (const o of s.enum) input.append($("option", { value: JSON.stringify(o), textContent: String(o) }));
    input.value = JSON.stringify(value());
    input.onchange = () => put(JSON.parse(input.value));
  } else if (s.type === "integer" || s.type === "number") {
    input = $("input", { type: "number", step: s.type === "integer" ? "1" : "any" });
    if (value() != null) input.value = value();
    input.placeholder = dflt == null ? "unset" : String(dflt);
    input.oninput = () => put(input.value === "" ? undefined : Number(input.value));
  } else if (s.type === "string") {
    input = $("input", { type: "text", value: value() ?? "", placeholder: dflt == null ? "unset" : String(dflt) });
    input.oninput = () => put(input.value === "" ? undefined : input.value);
  } else {
    // Anything else (lists, tables, enums with data) as JSON.
    input = $("textarea", { rows: 2, value: JSON.stringify(value() ?? null) });
    input.onchange = () => {
      try { put(JSON.parse(input.value)); input.style.outline = ""; }
      catch { input.style.outline = "2px solid #b3261e"; }
    };
  }
  reset.onclick = () => { put(undefined); render(); };
  row.append($("span", { className: "name", textContent: name }), input, reset);
  if (raw.description || s.description) row.append($("span", { className: "doc", textContent: raw.description || s.description }));
  mark();
  return row;
}

// ---- the scenario page ---------------------------------------------------

function render() {
  const main = document.getElementById("main");
  main.replaceChildren();
  if (!scenario) { main.append($("p", { textContent: "Pick a scenario." })); return; }
  const sc = scenario;
  sc.evcc ??= { kind: "evcc-sim" };
  sc.secc ??= { kind: "evse-sim" };

  const top = $("div", {}, $("h2", { textContent: sc.name }), $("p", { className: "desc", textContent: sc.description || "" }));
  const num = (label, get, put, step = "1") => {
    const i = $("input", { type: "number", step, value: get() ?? "" });
    i.oninput = () => { put(i.value === "" ? undefined : Number(i.value)); refresh(); };
    return $("label", { textContent: label }, i);
  };
  const check = (label, get, put) => {
    const i = $("input", { type: "checkbox", checked: !!get() });
    i.onchange = () => { put(i.checked); refresh(); };
    return $("label", { textContent: label }, i);
  };
  const pki = $("select");
  for (const p of ["", "p521", "ed448", "p256", "partner"]) pki.append($("option", { value: p, textContent: p || "default" }));
  pki.value = sc.pki ?? "";
  pki.onchange = () => { if (pki.value) sc.pki = pki.value; else delete sc.pki; refresh(); };
  const row = $("div", { className: "row" },
    num("timeout (s)", () => sc.timeout_s, v => { if (v === undefined) delete sc.timeout_s; else sc.timeout_s = v; }),
    $("label", { textContent: "pki" }, pki),
    num("delay (ms)", () => sc.impairment?.delay_ms, v => setPath(sc, ["impairment", "delay_ms"], v)),
    num("loss (%)", () => sc.impairment?.loss_percent, v => setPath(sc, ["impairment", "loss_percent"], v), "any"),
    check("charger TLS", () => sc.secc.tls, v => { sc.secc.tls = v; }),
    check("vehicle TLS", () => sc.evcc.tls, v => { sc.evcc.tls = v; }));

  sc.evcc.settings ??= {};
  sc.secc.settings ??= {};
  const columns = $("div", { className: "columns" },
    $("fieldset", {}, $("legend", { textContent: "vehicle (evcc-sim)" }), form(schemas.evcc.schema, schemas.evcc.schema, sc.evcc.settings, schemas.evcc.defaults)));
  if (sc.secc.kind === "evse-sim") {
    columns.append($("fieldset", {}, $("legend", { textContent: "charger (evse-sim)" }), form(schemas.secc.schema, schemas.secc.schema, sc.secc.settings, schemas.secc.defaults)));
  } else {
    columns.append($("fieldset", {}, $("legend", { textContent: "charger (" + sc.secc.kind + ")" }), $("p", { textContent: "An external implementation; it has no settings here." })));
  }

  const expect = $("textarea", { rows: 4, value: JSON.stringify(sc.expect ?? {}, null, 2) });
  expect.onchange = () => {
    try { sc.expect = JSON.parse(expect.value); expect.style.outline = ""; refresh(); }
    catch { expect.style.outline = "2px solid #b3261e"; }
  };

  const run = $("button", { id: "run", textContent: "Run", disabled: running });
  run.onclick = start;
  main.append(top, row, columns,
    $("label", { textContent: "must hold afterwards (expect)" }, expect),
    $("details", {}, $("summary", { textContent: "scenario as JSON" }), $("pre", { id: "json" })),
    $("div", { className: "row" }, run, $("span", { id: "verdict" })),
    $("div", { className: "logs", id: "logs" }));
  refresh();
}

// The JSON preview follows the edits; empty tables stay out of the scenario.
function clean() {
  const sc = structuredClone(scenario);
  for (const p of [sc.evcc, sc.secc]) {
    if (p.settings && Object.keys(p.settings).length === 0) delete p.settings;
    if (!p.tls) delete p.tls;
  }
  if (sc.secc.kind !== "evse-sim") delete sc.secc.settings;
  return sc;
}
function refresh() {
  const pre = document.getElementById("json");
  if (pre) pre.textContent = JSON.stringify(clean(), null, 2);
}

// ---- running -------------------------------------------------------------

function start() {
  const verdict = document.getElementById("verdict");
  const logs = document.getElementById("logs");
  verdict.className = ""; verdict.textContent = "starting…";
  logs.replaceChildren();
  api("/api/runs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(clean()) })
    .then(({ id }) => {
      running = true;
      document.getElementById("run").disabled = true;
      verdict.textContent = "running…";
      const panes = {};
      const es = new EventSource(`/api/runs/${id}/events`);
      es.addEventListener("log", e => {
        const { file, text } = JSON.parse(e.data);
        if (!panes[file]) {
          const pre = $("pre");
          panes[file] = pre;
          logs.append($("div", { className: "log" }, $("h3", { textContent: file }), pre));
        }
        const pre = panes[file];
        const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
        pre.append(text);
        if (atEnd) pre.scrollTop = pre.scrollHeight;
      });
      // The verdict is the end of the run: the stream is closed here, or the browser would reconnect and replay the logs.
      const finish = () => {
        es.close();
        running = false;
        const button = document.getElementById("run");
        if (button) button.disabled = false;
      };
      es.addEventListener("result", e => {
        verdict.textContent = e.data.trim();
        verdict.className = /^PASS/m.test(e.data) ? "pass" : "fail";
        finish();
      });
      es.addEventListener("end", finish);
      es.onerror = () => { if (es.readyState === EventSource.CLOSED) running = false; };
    })
    .catch(e => { verdict.className = "fail"; verdict.textContent = e.message; });
}

  else document.documentElement.dataset.theme = t;
  document.getElementById("theme").textContent = t;
  localStorage.setItem("theme", t);
}
document.getElementById("theme").onclick = () => {
  const now = localStorage.getItem("theme") || "auto";
  setTheme(themes[(themes.indexOf(now) + 1) % themes.length]);
};

function showTab(name) {
  document.getElementById("scenarios-view").hidden = name !== "scenarios";
  document.getElementById("sim-view").hidden = name !== "sim";
  document.getElementById("tab-scenarios").classList.toggle("current", name === "scenarios");
  document.getElementById("tab-sim").classList.toggle("current", name === "sim");
  document.title = name === "sim" ? "evcc-rs simulation" : "evcc-rs scenarios";
}

  secc: {},

async function simPost(path, body) {
  const msg = document.getElementById("sim-msg");
  try {
    const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body ?? {}) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    msg.textContent = "";
    return data;
  } catch (e) { msg.textContent = e.message; }
}
const simCmd = (target, cmd) => simPost("/api/sim/cmd", { target, cmd });

const fmt = v => (v == null ? "–" : Number.isInteger(v) ? String(v) : (Math.round(v * 100) / 100).toString());

// Names of settings are the keys of the settings files; the page shows words and units.
const UNITS = [["_percent_per_min", "%/min"], ["_hz", "Hz"], ["_wh", "Wh"], ["_ms", "ms"], ["_w", "W"], ["_a", "A"], ["_v", "V"], ["_s", "s"], ["_soc", "%"]];
function pretty(name) {
  let base = name, unit = "";
  for (const [suffix, u] of UNITS) {
    if (name.endsWith(suffix)) { base = name.slice(0, -suffix.length) + (suffix === "_soc" ? " SoC" : ""); unit = u; break; }
  }
  const words = base.replace(/_/g, " ").replace(/\bsoc\b/i, "SoC").replace(/^ac\b/, "AC");
  return { label: words.charAt(0).toUpperCase() + words.slice(1), unit };
}

// A table of limits: the value for the next session (editable) next to the one in use, which
// only shows while a session runs. Discharge limits belong to the bidirectional service.
function limitsTable(title, root, owner, state, defaults, usedKey) {
  const props = strip(root, strip(root, owner).properties.limits).properties;
  const table = $("table", { className: "values limits hide-used" });
  table.append($("tr", {}, $("th", { textContent: "" }), $("th", { textContent: "next session" }), $("th", { className: "used", textContent: "in use" })));
  const base = getPath(defaults, ["limits"]) ?? {};
  const groups = new Set();
  // DC limits first, then the AC ones (per line); each kind charging, then discharging.
  const kind = name => (name.startsWith("ac_") ? 2 : 0) + (name.includes("discharge") ? 1 : 0);
  const names = Object.keys(props).sort((a, b) => kind(a) - kind(b));
  const GROUPS = ["Charging", "Discharging (bidirectional)", "AC charging, per line", "AC discharging, per line (bidirectional)"];
  // What a row needs to be shown (see applyProtocol): the bidirectional service, the AC service, the DC ones.
  const NEEDS = ["dc", "dc bpt", "ac", "ac bpt"];
  for (const name of names) {
    const bpt = name.includes("discharge");
    const group = GROUPS[kind(name)];
    if (!groups.has(group)) {
      groups.add(group);
      table.append($("tr", { className: "group", "data-need": NEEDS[kind(name)] }, $("td", { colSpan: 3, textContent: group })));
    }
    const input = $("input", { type: "number", step: "any", placeholder: base[name] == null ? "unset" : String(base[name]) });
    const cur = getPath(state, ["limits", name]);
    input.value = cur ?? (base[name] ?? "");
    input.classList.toggle("set", cur !== undefined);
    input.oninput = () => {
      setPath(state, ["limits", name], input.value === "" ? undefined : Number(input.value));
      input.classList.toggle("set", input.value !== "");
      updateUsed();
    };
    // The limit in use: editable while a session runs, effective from the next message on.
    const used = $("input", { type: "number", step: "any", id: `used-${usedKey}-${name}`, disabled: true, title: "the limit in use; change it while the session runs" });
    used.onchange = () => {
      if (used.value !== "") simCmd(usedKey, { cmd: "limits", key: name, value: Number(used.value) });
    };
    const { label, unit } = pretty(name);
    const doc = strip(root, props[name]).description || props[name].description || "";
    table.append($("tr", { "data-need": NEEDS[kind(name)] },
      $("td", { className: "name" }, $("span", { className: doc ? "hint" : "", title: doc, textContent: label }), $("span", { className: "u", textContent: unit })),
      $("td", {}, input), $("td", { className: "used" }, used)));
  }
  return $("div", { className: "panel" }, $("h3", { textContent: title }), table);
}

// "In use" shows the limits of the session in progress; amber when the next session differs.
function updateUsed() {
  for (const t of document.querySelectorAll("table.limits")) t.classList.toggle("hide-used", !sim.view.running);
  for (const [key, side, root, state, defaults] of [["ev", sim.view.ev, schemas.evcc.schema, sim.evcc, schemas.evcc.defaults], ["evse", sim.view.evse, schemas.secc.schema, sim.secc, schemas.secc.defaults.session]]) {
    const used = side?.limits;
    for (const el of document.querySelectorAll(`[id^="used-${key}-"]`)) {
      const name = el.id.slice(`used-${key}-`.length);
      const u = used?.[name];
      el.disabled = used == null || !sim.view.running;
      if (document.activeElement !== el) el.value = u == null ? "" : u;
      const next = getPath(state, ["limits", name]) ?? getPath(defaults, ["limits", name]);
      el.classList.toggle("pending", used != null && (next ?? null) !== (u ?? null));
    }
  }
}

// A measurement: value (typing sets it by hand), Auto (the model's value), what was sent.
function measureRow(target, key, label, unit) {
  const input = $("input", { type: "number", step: "any" });
  const auto = $("input", { type: "checkbox" });
  const sent = $("td", { className: "used" });
  input.onchange = () => { if (input.value !== "") simCmd(target, { cmd: "measure", key, value: Number(input.value) }); };
  auto.onchange = () => simCmd(target, { cmd: "measure", key, auto: auto.checked });
  sim.ui[`${target}.${key}`] = { input, auto, sent, unit };
  return $("tr", {}, $("td", { className: "name", textContent: label }), $("td", {}, input), $("td", {}, auto), sent);
}

function measureTable(title, rows) {
  const table = $("table", { className: "values" });
  table.append($("tr", {}, $("th", { textContent: "" }), $("th", { textContent: "value" }), $("th", { textContent: "auto" }), $("th", { textContent: "sent" })));
  for (const r of rows) table.append(r);
  return $("div", {}, $("b", { textContent: title }), table);
}

const timeline = { rows: [], hideRepeats: true, detail: null, dirty: false };

function onMsg(e) {

      if (rows[i].src === e.src && rows[i].dir === "←" && rows[i].msg === e.msg && !rows[i].code) { rows[i].code = e.code; rows[i].events.push(e); timeline.dirty = true; return; }

const sleep = ms => new Promise(r => setTimeout(r, ms));

// One button: open the simulation when it is closed, start a session, and let it run (or, for
// stepping, hold it before its first message).
async function startSession(step) {
  if (sim.starting) return;
  sim.starting = true;
  applyView();
  try {
    if (!sim.view.open) {
      const c = sim.conn;
      if (await simPost("/api/sim/open", { tls: c.tls, slac: c.slac, pki: c.pki }) === undefined) return;
      const deadline = Date.now() + 120000;
      while (!(sim.view.open && sim.view.evse) && Date.now() < deadline && !sim.view.error) await sleep(150);
      if (!sim.view.open) return;
    }
    if (await simPost("/api/sim/session", { evcc: sim.evcc, secc: sim.secc }) === undefined) return;
    if (!step) {
      // The vehicle takes the command once its session exists; ask until it says it runs freely.
      const deadline = Date.now() + 10000;
      while (!sim.view.ev?.free_run && Date.now() < deadline) {
        if (sim.view.ev && sim.view.running) await simCmd("ev", { cmd: "run" });
        await sleep(250);
      }
    }
  } finally {
    sim.starting = false;
    applyView();
  }
}

function buildSim() {
  const view = document.getElementById("sim-view");
  sim.conn ??= { tls: false, slac: false, pki: "p521" };
  sim.mode ??= "plug";
  const checkbox = (id, key, text, title) => {
    const box = $("input", { type: "checkbox", id, checked: sim.conn[key] });
    box.onchange = () => { sim.conn[key] = box.checked; };
    return $("label", { className: "inline", title }, box, text);
  };
  const pki = $("select", { id: "sim-pki", title: "the certificates TLS uses" });
  for (const p of ["p521", "ed448", "p256"]) pki.append($("option", { value: p, textContent: p }));
  pki.value = sim.conn.pki;
  pki.onchange = () => { sim.conn.pki = pki.value; };

  const protocol = $("div", { className: "seg", id: "sim-protocol", role: "group", "aria-label": "protocol" });
  for (const p of PROTOCOLS) {
    const b = $("button", { type: "button", textContent: p.label, id: `proto-${p.id}` });
    b.onclick = () => { selectProtocol(p); buildSim(); };
    protocol.append(b);
  }

  // ISO 15118-20 only: DC or AC, and bidirectional.
  const energy = $("div", { className: "seg energy-only", id: "sim-energy", role: "group", "aria-label": "energy transfer" });
  for (const [id, label, ac] of [["dc", "DC", false], ["ac", "AC", true]]) {
    const b = $("button", { type: "button", textContent: label, id: `energy-${id}` });
    b.onclick = () => { if (ac) sim.evcc.ac = true; else { delete sim.evcc.ac; delete sim.evcc.scheduled; } buildSim(); };
    energy.append(b);
  }
  const bpt = $("input", { type: "checkbox", id: "sim-bpt", checked: !!sim.evcc.bpt });
  bpt.onchange = () => { if (bpt.checked) sim.evcc.bpt = true; else delete sim.evcc.bpt; buildSim(); };
  const bptLabel = $("label", { className: "inline iso20-only", title: "bidirectional power transfer: the car can give energy back" }, bpt, "BPT");

  const scheduled = $("input", { type: "checkbox", id: "sim-scheduled", checked: !!sim.evcc.scheduled });
  scheduled.onchange = () => { if (scheduled.checked) sim.evcc.scheduled = true; else delete sim.evcc.scheduled; };
  const scheduledLabel = $("label", { className: "inline ac-only", title: "Scheduled control mode: the car selects one of the charger's schedules and follows it" }, scheduled, "Scheduled");

  const needs = $("input", { type: "checkbox", id: "sim-mobility-needs", checked: !!sim.evcc.mobility_needs_by_secc });
  needs.onchange = () => { if (needs.checked) sim.evcc.mobility_needs_by_secc = true; else delete sim.evcc.mobility_needs_by_secc; };
  const needsLabel = $("label", { className: "inline iso20-only", title: "MobilityNeedsMode 2: the charger may provide the departure time and the state of charge limits" }, needs, "Needs from charger");

  const primary = $("button", { id: "primary", className: "big", type: "button" });
  primary.onclick = () => (sim.view.running ? simCmd("ev", { cmd: "advance", to: "ended" }) : startSession(false));
  const stepStart = $("button", { id: "step-start", className: "quiet", type: "button", textContent: "Start and step through", title: "start a session that holds before its first message; then click a phase to run up to it" });
  stepStart.onclick = () => startSession(true);
  const close = $("button", { id: "sim-close", className: "quiet", type: "button", textContent: "End simulation", title: "stop the simulated vehicle and charger" });
  close.onclick = () => simPost("/api/sim/close");

  const presets = $("div", { className: "presets" }, $("span", { className: "label", textContent: "Start from" }));
  for (const p of PRESETS) {
    const b = $("button", { type: "button", className: "chip", textContent: p.name, title: p.title });
    b.onclick = () => { sim.evcc = structuredClone({ ...BASE_EVCC, ...p.evcc }); sim.mode = "plug"; buildSim(); };
    presets.append(b);
  }

  // What the car and the charger do, at a glance, as numbers; the flow bar shows the direction.
  const tile = (id, cls, key, value, sub) => $("div", { className: `tile ${cls}`, id: `tile-${id}` }, $("span", { className: "k", textContent: key }), $("span", { className: "v", id: `v-${id}` }), $("span", { className: "sub", id: `s-${id}` }), ...(sub ?? []));
  const tiles = $("div", { className: "tiles" },
    tile("power", "hero", "Power", 0, [$("div", { className: "flow" }, $("i", { id: "flow-bar" }))]),
    tile("soc", "", "Battery", 0, [$("div", { className: "meter" }, $("i", { id: "soc-bar" }))]),
    tile("voltage", "", "Voltage"), tile("current", "", "Current"), tile("phase", "phase", "Now"));

  // The phases are buttons: click one to run up to it and hold before it, shift-click to run into it.
  const stepper = $("div", { className: "stepper", id: "stepper" });
  for (const [id, name] of PHASES) {
    if (id === "connecting") continue;
    const b = $("button", { type: "button", id: `phase-${id}`, textContent: name, title: "run up to this phase and hold before it (shift: run into it and stay)" });
    b.onclick = e => simCmd("ev", { cmd: "advance", to: id, stay: e.shiftKey });
    stepper.append(b);
  }
  const real = $("input", { type: "checkbox", id: "real-timers" });
  real.onchange = () => simCmd("ev", { cmd: "real_timers", on: real.checked });
  const sessionPanel = $("div", { className: "panel" },
    $("div", { className: "row tight" }, $("h3", { textContent: "Session", style: "margin:0" }), $("span", { id: "sim-held", className: "note" }),
      $("span", { style: "flex:1" }), $("label", { className: "inline", title: "off: the time spent held does not count against the protocol timeouts" }, real, "real timers while held")),
    stepper);

  const evTable = limitsTable("Vehicle", schemas.evcc.schema, schemas.evcc.schema, sim.evcc, schemas.evcc.defaults, "ev");
  const seccRoot = schemas.secc.schema;
  const seccSchema = seccRoot.properties.session;
  const evseTable = limitsTable("Charger", seccRoot, seccSchema, sim.secc, schemas.secc.defaults.session, "evse");
  // Start state of charge sits with the vehicle's numbers.
  const start = $("input", { type: "number", min: 0, max: 100, value: sim.evcc.start_soc ?? schemas.evcc.defaults.start_soc });
  start.oninput = () => setPath(sim.evcc, ["start_soc"], start.value === "" ? undefined : Number(start.value));
  evTable.append($("label", { className: "inline", style: "margin-top:.6rem" }, "Battery at the start (%)", start));

  const more = (title, root, schema, state, defaults, omit, id) =>
    $("details", { id, open: true }, $("summary", { textContent: title }), form(root, schema, state, defaults, [], () => {}, omit));
  const manual = $("details", {}, $("summary", { textContent: "Set measurements by hand" }),
    $("div", { className: "columns" },
      measureTable("Vehicle", [measureRow("ev", "voltage", "Battery voltage (V)"), measureRow("ev", "soc", "State of charge (%)")]),
      measureTable("Charger", [measureRow("evse", "voltage", "Present voltage (V)"), measureRow("evse", "current", "Present current (A)"), measureRow("evse", "max_power", "Maximum power (W)")])));

  const modeSeg = $("div", { className: "seg", id: "sim-mode", role: "group", "aria-label": "connection" });
  for (const m of MODES) {
    const b = $("button", { type: "button", textContent: m.label, id: `mode-${m.id}` });
    b.onclick = () => {
      sim.mode = m.id;
      sim.arrive = true;
      if (m.protocol) selectProtocol(PROTOCOLS.find(p => p.id === m.protocol));
      buildSim();
    };
    modeSeg.append(b);
  }
  const label = text => $("div", { className: "label", textContent: text });
  const connection = $("div", { className: "panel stack" }, $("h3", { textContent: "Connection", style: "margin:0" }),
    modeSeg, label("Protocol"), protocol,
    $("div", { className: "label energy-only", textContent: "Energy" }), energy,
    $("div", { className: "opts" }, bptLabel, scheduledLabel, needsLabel),
    $("div", { className: "stack plug-only" }, label("Link"),
      $("div", { className: "opts" }, checkbox("sim-tls", "tls", "TLS", "encrypt the connection"), checkbox("sim-slac", "slac", "SLAC", "match the vehicle to the charger over the powerline first")),
      $("label", { className: "inline" }, "Certificates", pki)),
    $("p", { className: "note wlan-only", textContent: "Link: Wi-Fi (IEEE 802.11), no TLS and no SLAC; the vehicle starts talking when the signal is strong enough." }),
    $("p", { id: "mode-note", className: "note" }));

  // The picture follows the connection and the session: the plug or pantograph engages while a session runs, current flows while energy does.
  const scene = $("div", { id: "sceneview", className: "sceneview" + (sim.arrive ? " arrive" : ""), "data-link": "0", "data-flow": "0" });
  scene.innerHTML = SCENE_DEFS + SCENES[sim.mode];
  scene.append($("span", { className: "cap", textContent: MODES.find(m => m.id === sim.mode).caption }));
  sim.arrive = false;
  const status = $("span", { id: "sim-status", className: "pill" });
  const top = $("div", { className: "simtop" }, scene, tiles,
    $("div", { className: "simctl" }, status, primary, $("div", { className: "btns" }, stepStart, close), $("div", { id: "sim-msg", className: "error" })));

  const TABS = [["setup", "Setup"], ["session", "Session"], ["signals", "Signals"], ["messages", "Messages"], ["faults", "Faults and pilot"], ["more", "More settings"]];
  const panes = {
    setup: $("div", { className: "setup" }, connection, $("div", { className: "pane" }, presets, $("div", { className: "columns" }, evTable, evseTable))),
    session: $("div", { className: "pane" }, sessionPanel, $("div", { className: "panel" }, manual)),
    signals: $("div", { className: "pane" }, buildGraph()),
    messages: $("div", { className: "pane" }, buildTimeline()),
    faults: $("div", { className: "columns wide" }, buildFaults(), buildPilot()),
    more: $("div", { className: "pane" }, $("div", { className: "panel" },
      more("More vehicle settings", schemas.evcc.schema, schemas.evcc.schema, sim.evcc, schemas.evcc.defaults, simOmitEv, "more-vehicle"),
      more("More charger settings", seccRoot, seccSchema, sim.secc, schemas.secc.defaults.session, simOmitSecc, "more-charger"),
      $("details", {}, $("summary", { textContent: "Raw logs" }), (sim.logs ??= $("div", { className: "logs", id: "sim-logs" }))))),
  };
  const tabs = $("div", { className: "subtabs", role: "tablist" });
  for (const [id, name] of TABS) {
    const b = $("button", { type: "button", textContent: name, id: `subtab-${id}`, role: "tab", "data-tab": id });
    b.onclick = () => showSimTab(id);
    tabs.append(b);
    panes[id].dataset.pane = id;
  }
  view.replaceChildren(top, tabs, $("div", { className: "tabbody" }, ...Object.values(panes)));
  showSimTab(sim.tab ?? "setup");
  timeline.dirty = true;
  updateUsed();
  applyView();
  if (!sim.timers) {
    sim.timers = true;
    setInterval(sampleSignals, 200);
    setInterval(() => { drawGraph(); drawTimeline(); }, 250);
  }
}

function showSimTab(id) {
  sim.tab = id;
  for (const b of document.querySelectorAll(".subtabs button")) { b.classList.toggle("current", b.dataset.tab === id); b.setAttribute("aria-selected", b.dataset.tab === id); }
  for (const p of document.querySelectorAll(".tabbody > [data-pane]")) p.hidden = p.dataset.pane !== id;
  if (id === "signals") drawGraph();
  if (id === "messages") { timeline.dirty = true; drawTimeline(); }
}

// Controls that belong to one protocol are hidden for the others; DIN SPEC 70121 and ISO 15118-2
// have no schedule exchange.
function applyProtocol() {
  const id = currentProtocol();
  const { ac, bpt } = energyKind();
  document.getElementById("phase-schedule_exchange").hidden = id === "iso2" || id === "din";
  // AC has no cable check or pre-charge, and nothing to weld.
  for (const phase of ["cable_check", "pre_charge"]) document.getElementById(`phase-${phase}`).hidden = ac;
  document.getElementById("phase-stop").textContent = ac ? "Stop" : "Stop and welding";
  document.querySelectorAll(".iso-only").forEach(e => e.hidden = id !== "iso20");
  document.querySelectorAll(".iso20-only").forEach(e => e.hidden = id !== "iso20");
  document.querySelectorAll(".ac-only").forEach(e => e.hidden = !ac);
  document.querySelectorAll(".din-only").forEach(e => e.hidden = id !== "din");
  document.querySelectorAll(".iso2-only").forEach(e => e.hidden = id !== "iso2");
  // Rows say what they need: the AC service, the bidirectional one, or the DC ones.
  const have = new Set([ac ? "ac" : "dc"]);
  if (bpt) have.add("bpt");
  document.querySelectorAll("[data-need]").forEach(e => { e.hidden = !e.dataset.need.split(" ").every(n => have.has(n)); });
  for (const p of PROTOCOLS) {
    const b = document.getElementById(`proto-${p.id}`);
    b.classList.toggle("on", p.id === id);
    b.setAttribute("aria-pressed", p.id === id);
  }
  for (const [kind, on] of [["dc", !ac], ["ac", ac]]) {
    const b = document.getElementById(`energy-${kind}`);
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on);
  }
  document.getElementById("sim-bpt").checked = bpt;
  // Only a plug has the energy choice, a powerline and TLS; the others talk over Wi-Fi.
  const plug = sim.mode === "plug";
  document.querySelectorAll(".energy-only").forEach(e => e.hidden = id !== "iso20" || !plug);
  document.querySelectorAll(".plug-only").forEach(e => e.hidden = !plug);
  document.querySelectorAll(".wlan-only").forEach(e => e.hidden = plug);
  document.getElementById("mode-note").textContent = MODE_NOTES[sim.mode];
  document.getElementById("mode-note").hidden = plug;
  for (const m of MODES) {
    const b = document.getElementById(`mode-${m.id}`);
    b.classList.toggle("on", m.id === sim.mode);
    b.setAttribute("aria-pressed", m.id === sim.mode);
  }
}

function applyView() {
  const v = sim.view, ev = v.ev, evse = v.evse;
  const $id = id => document.getElementById(id);
  applyProtocol();
  const phase = ev?.phase ?? "connecting";
  const cur = phaseIndex(phase);
  const live = v.running && !!ev;
  for (const [id] of PHASES) {
    const el = $id(`phase-${id}`);
    if (!el) continue;
    const i = phaseIndex(id);
    el.className = !v.running && !ev ? "" : i < cur ? "done" : i === cur ? "current" + (ev?.held ? " held" : "") : "";
    el.disabled = !live;
  }
  const status = $id("sim-status");
  const busy = v.opening || sim.starting;
  status.textContent = v.opening ? "opening the simulation…" : v.open ? (v.running ? `session ${v.session} running` : v.session ? `session ${v.session} ended (exit ${v.exit_code ?? "?"})` : "ready") : "not started";
  status.className = "pill " + (busy ? "busy" : v.running ? "live" : "");
  const primary = $id("primary");
  primary.textContent = busy ? "Starting…" : v.running ? "Stop charging" : "Start session";
  primary.className = "big" + (v.running ? " danger" : "");
  const runnable = sim.mode === "plug";
  primary.disabled = busy || (!v.running && !runnable);
  primary.title = !runnable && !v.running ? "this page starts plug sessions only so far" : "";
  $id("step-start").hidden = !!v.running;
  $id("step-start").disabled = busy || !runnable;
  $id("sim-close").disabled = !v.open || v.opening;
  for (const id of ["sim-tls", "sim-slac", "sim-pki"]) $id(id).disabled = v.open || v.opening;
  for (const b of [...$id("sim-protocol").children, ...$id("sim-energy").children]) b.disabled = !!v.running || !runnable;
  for (const b of [...$id("sim-mode").children, $id("sim-bpt"), $id("sim-scheduled"), $id("sim-mobility-needs")]) b.disabled = !!v.running;
  $id("sim-held").textContent = !ev ? "" : ev.held ? `held before ${phaseName(ev.phase)}: click a phase to go on` : !v.running ? "" : ev.free_run ? "" : ev.stay && ev.phase === ev.target ? `staying in ${phaseName(ev.phase)}` : `running ${ev.stay ? "into" : "up to"} ${phaseName(ev.target)}`;
  if (document.activeElement !== $id("real-timers")) $id("real-timers").checked = !!ev?.real_timers;
  for (const [target, side] of [["ev", ev], ["evse", evse]]) {
    for (const [key, m] of Object.entries(side?.measurements ?? {})) {
      const ui = sim.ui[`${target}.${key}`];
      if (!ui) continue;
      ui.auto.checked = m.auto;
      if (document.activeElement !== ui.input) ui.input.value = fmt(m.auto ? m.effective : m.manual);
      ui.sent.textContent = fmt(m.effective);
    }
  }
  // The readouts.
  const volts = evse?.measurements.voltage.effective ?? 0, amps = evse?.measurements.current.effective ?? 0;
  const kw = volts * amps / 1000;
  const mode = kw > 0.05 ? "charging" : kw < -0.05 ? "discharging" : "";
  const put = (id, html) => { $id(id).replaceChildren(...html); };
  const unit = (value, u) => [String(value), $("small", { textContent: u })];
  put("v-power", unit(Math.abs(kw).toFixed(1), "kW"));
  $id("s-power").textContent = mode === "charging" ? "into the battery" : mode === "discharging" ? "out of the battery" : live ? "no energy flowing" : "";
  $id("tile-power").className = `tile hero ${mode}`;
  const lines = energyKind().ac ? evse?.limits?.ac_phases ?? 3 : 1;
  const maxW = energyKind().ac
    ? lines * (kw < 0 ? evse?.limits?.ac_max_discharge_power_w ?? 3680 : evse?.limits?.ac_max_charge_power_w ?? 3680)
    : kw < 0 ? evse?.limits?.max_discharge_power_w ?? 11000 : evse?.limits?.max_charge_power_w ?? 150000;
  const span = Math.max(1, maxW / 1000);
  const share = Math.max(-1, Math.min(1, kw / span)) * 50;
  $id("flow-bar").style.left = `${50 + Math.min(0, share)}%`;
  $id("flow-bar").style.width = `${Math.abs(share)}%`;
  const soc = ev?.measurements.soc.effective;
  put("v-soc", soc == null ? ["–"] : unit(soc.toFixed(1), "%"));
  $id("soc-bar").style.width = `${Math.max(0, Math.min(100, soc ?? 0))}%`;
  const target = ev?.limits?.target_soc;
  $id("s-soc").textContent = soc == null ? "" : ev.limits.discharge_to_soc != null && ev.model_soc > ev.limits.discharge_to_soc ? `giving back down to ${ev.limits.discharge_to_soc} %` : target != null ? `target ${target} %` : "";
  put("v-voltage", unit(fmt(volts), "V"));
  $id("s-voltage").textContent = ev ? `battery ${fmt(ev.measurements.voltage.effective)} V` : "";
  put("v-current", unit(fmt(amps), "A"));
  $id("s-current").textContent = evse ? `charger asked for up to ${fmt(evse.ev_reports.max_current)} A` : "";
  const picture = $id("sceneview");
  picture.dataset.link = live ? "1" : "0";
  picture.dataset.flow = live && mode !== "" ? "1" : "0";
  $id("v-phase").textContent = ev ? phaseName(phase) : v.open ? "Ready" : "Not started";
  $id("s-phase").textContent = ev?.result ?? (ev?.state ?? "");
  updateFaults();
  updatePilot();
  if (v.error) $id("sim-msg").textContent = v.error;
  updateUsed();
}

function connectSim() {
  const es = new EventSource("/api/sim/events");
  const panes = {};
  es.addEventListener("state", e => {
    const next = JSON.parse(e.data);
    // A new simulation or session starts with clean logs.
    if (next.artifacts !== sim.view.artifacts || next.session !== sim.view.session) {
      if (next.artifacts !== sim.view.artifacts) {
        for (const k of Object.keys(panes)) delete panes[k];
        timeline.rows = []; timeline.detail = null; timeline.dirty = true; graph.samples = [];
      }
      const logs = document.getElementById("sim-logs");
      if (logs && next.artifacts !== sim.view.artifacts) logs.replaceChildren();
    }
    sim.view = next;
    applyView();
  });
  es.addEventListener("msg", e => onMsg(JSON.parse(e.data)));
  es.addEventListener("log", e => {
    const { file, text } = JSON.parse(e.data);
    const logs = document.getElementById("sim-logs");
    if (!logs) return;
    if (!panes[file]) {
      panes[file] = $("pre");
      logs.append($("div", { className: "log" }, $("h3", { textContent: file }), panes[file]));
    }
    const pre = panes[file];
    const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 8;
    pre.append(text);
    if (atEnd) pre.scrollTop = pre.scrollHeight;
  });
}

// ---- start ---------------------------------------------------------------

async function load(file, link) {
  location.hash = file;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("current", a === link));
  scenario = await api("/api/scenarios/" + file);
  render();
}

(async () => {
  schemas = await api("/api/schema");
  buildSim();
  if (!location.search.includes("static")) connectSim();
  if (location.hash === "#simulation") showTab("sim");
  const list = document.getElementById("list");
  for (const s of await api("/api/scenarios")) {
    const a = $("a", { textContent: s.file, title: s.description });
    a.onclick = () => load(s.file, a);
    list.append(a);
    if (location.hash.slice(1) === s.file) { showTab("scenarios"); a.click(); }
  }
})();
