name = "dc-iso2-pnc"
description = "ISO 15118-2 Plug & Charge: the vehicle pays with its contract (PaymentDetailsReq with the eMAID and the contract chain, secp256r1), the charger checks the chain against the eMSP root and sends a challenge, the vehicle signs the AuthorizationReq (ECDSA, SHA-256, canonical EXI fragments) and the charger verifies the signature."
timeout_s = 30

[secc]
kind = "evse-sim"
[secc.settings.session.iso2]
offer_contract_payment = true

[evcc]
kind = "evcc-sim"
pnc = true
[evcc.settings]
protocol = "iso15118-2"
connector = "dual2"
poll_interval_ms = 10
charge_loop_interval_ms = 10

[expect]
secc_exit = 0
evcc_log = ["session: Ended(Completed)"]
secc_log = ["PaymentDetailsReq: eMAID", "accepted", "contract authorization: OK", "session: Stopped"]
