name = "pause-resume"
description = "The vehicle pauses the session after two charge loop rounds (SessionStopReq Pause) and closes the connection; half a second later it connects again, makes a new TLS 1.3 session and resumes with the old session id: no authorization, no service selection, charge parameter discovery next. The second charge ends when the vehicle stops after three rounds."
timeout_s = 40
pki = "p521"

[secc]
kind = "evse-sim"
tls = true
[secc.settings]
sessions = 2

[evcc]
kind = "evcc-sim"
tls = true
[evcc.settings]
stop_after = 3
pause_after = 2
resume_after_ms = 500
poll_interval_ms = 10
charge_loop_interval_ms = 10

[expect]
secc_exit = 0
evcc_log = ["paused; resuming", "SessionResumed", "session: Ended(Completed)"]
secc_log = ["session: Paused", "session: Stopped"]
