name = "interop-iso15118-python"
description = "The simulated vehicle against the SECC of the open-source Python iso15118 library (0.31.2): ISO 15118-20 DC, EIM, plain TCP."
timeout_s = 60

[secc]
kind = "iso15118-python"

[evcc]
kind = "evcc-sim"
[evcc.settings]
connector = "extended"   # the partner offers only Connector 2

[expect]
evcc_log = ["session: Ended(Completed)"]
