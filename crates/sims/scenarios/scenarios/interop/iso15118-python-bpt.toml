name = "interop-iso15118-python-bpt"
description = "The simulated vehicle selects DC_BPT against the SECC of the Python iso15118 library (0.31.2): ISO 15118-20 bidirectional DC, EIM, plain TCP."
timeout_s = 60

[secc]
kind = "iso15118-python"

[evcc]
kind = "evcc-sim"
[evcc.settings]
bpt = true
connector = "extended"   # the partner offers only Connector 2

[expect]
evcc_log = ["session: Ended(Completed)"]
