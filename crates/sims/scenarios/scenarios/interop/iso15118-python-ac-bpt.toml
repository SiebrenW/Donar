name = "interop-iso15118-python-ac-bpt"
description = "The simulated vehicle selects AC_BPT against the SECC of the Python iso15118 library (0.31.2): ISO 15118-20 bidirectional AC, EIM, plain TCP."
timeout_s = 60

[secc]
kind = "iso15118-python"
protocols = "ISO_15118_20_AC"

[evcc]
kind = "evcc-sim"
[evcc.settings]
ac = true
bpt = true

[expect]
evcc_log = ["session: Ended(Completed)"]
