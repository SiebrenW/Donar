name = "interop-iso15118-python-ac-scheduled"
description = "The simulated vehicle charges AC in Scheduled control mode against the SECC of the Python iso15118 library (0.31.2): it takes the library's schedule tuples, selects one and runs the Scheduled charge loop."
timeout_s = 60

[secc]
kind = "iso15118-python"
protocols = "ISO_15118_20_AC"

[evcc]
kind = "evcc-sim"
[evcc.settings]
ac = true
scheduled = true

[expect]
evcc_log = ["session: Ended(Completed)"]
