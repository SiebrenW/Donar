name = "acdp-pantograph-stuck-up"
description = "ACDP, a pantograph that does not go up after the stop (it stays in Moving): ACDP_Disconnect never finishes. The vehicle repeats the request for its Ongoing bound and ends with a timeout, without SessionStop; it does not drive off, since the pantograph is not home (nothing in this step acts on it)."
timeout_s = 60
# The link is WLAN (ISO 15118-8): no SLAC; the control pilot exists only through the pantograph's contacts.

[secc]
kind = "evse-sim"
[secc.settings.session.acdp]
ppd = "optical"
pantograph_move_ms = 600
pantograph_fault = "stuck_raising"

[evcc]
kind = "evcc-sim"
[evcc.settings]
poll_interval_ms = 50
charge_loop_interval_ms = 10
ongoing_timeout_ms = 2000
[evcc.settings.acdp]
positioning_support = true

[expect]
evcc_exit = 1
evcc_log = ["mechanical: EndPosition", "mechanical: Moving", "session: Ended(Timeout)"]
secc_log = ["pantograph disconnect: the vehicle sees StateB"]
