name = "dc-tls-ed448"
description = "SDP by multicast, TLS 1.3 with mutual authentication (Ed448 certificates made for the run) and a DC session."
timeout_s = 40
pki = "ed448"

[secc]
kind = "evse-sim"
tls = true

[evcc]
kind = "evcc-sim"
tls = true
[evcc.settings]
poll_interval_ms = 10
charge_loop_interval_ms = 10

[expect]
secc_exit = 0
evcc_log = ["tls: TLSv1.3 TLS_AES_256_GCM_SHA384", "session: Ended(Completed)"]
secc_log = ["tls: TLSv1.3", "session: Stopped"]
