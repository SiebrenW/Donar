name = "service-renegotiation"
description = "The charger offers service renegotiation and asks for one after two charge loop rounds: the vehicle ends the charge in order, stops with ChargingSession ServiceRenegotiation, discovers services again on the same connection and charges a second time; the charger terminates that one."
timeout_s = 30

[secc]
kind = "evse-sim"
[secc.settings]
slac_responder = true

[secc.settings.session]
service_renegotiation_supported = true
service_renegotiation_after_loops = 2
terminate_after_loops = 3

[evcc]
kind = "evcc-sim"
[evcc.settings]
slac = true
stop_after = 0
poll_interval_ms = 10
charge_loop_interval_ms = 10

[expect]
secc_exit = 0
evcc_log = ["session: Ended(Completed)"]
secc_log = ["session: Stopped"]
