name = "dc-pilot-emergency-by-evse"
description = "ISO 15118-20 DC: after two charge loop requests the charger has an emergency of its own (IEC 61851-23 CC.3.4.3, scenario 2): its CP oscillator goes off and it drops the connection without a word. The vehicle sees the oscillator off while it holds state C, ends the session at once (Emergency) and sends nothing more."
timeout_s = 30

[secc]
kind = "evse-sim"
[secc.settings.session]
pilot_emergency_after_loops = 2

[evcc]
kind = "evcc-sim"
[evcc.settings]
poll_interval_ms = 10
charge_loop_interval_ms = 10
stop_after = 0

[expect]
evcc_exit = 1
secc_exit = 1
evcc_log = ["Emergency(Reading { state: C, pwm: Off })"]
secc_log = ["an emergency of its own"]
