name = "acdp-dc"
description = "A complete ACDP session (ISO 15118-20 8.3.4.7, service DC_ACDP, Table 80): wireless SDP, the positioning of the bus, authorization and service selection (no Connector in the parameter set), charge parameters and schedule exchange, then ACDP_Connect (the pantograph moves down, the control pilot state its contacts give goes from A to B) before the cable check, pre-charge and the charge loop; after the stop ACDP_Disconnect (the pantograph goes up) takes the place of the welding detection, and the session stops."
timeout_s = 60
# The link is WLAN (ISO 15118-8): no SLAC; the control pilot exists only through the pantograph's contacts.

[secc]
kind = "evse-sim"
[secc.settings.session.acdp]
ppd = "optical"
pantograph_move_ms = 600

[evcc]
kind = "evcc-sim"
[evcc.settings]
poll_interval_ms = 50
charge_loop_interval_ms = 10
[evcc.settings.acdp]
positioning_support = true

[expect]
secc_exit = 0
evcc_log = ["service_id: 4", "Pantograph { processing: Ongoing", "mechanical: EndPosition", "mechanical: Home", "session: Ended(Completed)"]
secc_log = ["service 4 selected", "pantograph connect: the vehicle sees StateA", "pantograph disconnect: the vehicle sees StateB", "session: Stopped"]
