name = "dc-bpt"
description = "A bidirectional ISO 15118-20 DC session over plain TCP: the vehicle selects the service DC_BPT, and parameter discovery and the charge loop use the BPT variants."
timeout_s = 30

[secc]
kind = "evse-sim"

[secc.settings]
slac_responder = true

[evcc]
kind = "evcc-sim"
[evcc.settings]
slac = true
bpt = true
poll_interval_ms = 10
charge_loop_interval_ms = 10

[expect]
secc_exit = 0
evcc_log = ["session: Ended(Completed)"]
secc_log = ["service 6 selected", "session: Stopped"]
