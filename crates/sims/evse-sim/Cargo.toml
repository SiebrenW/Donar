[package]
name = "evse-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
v2gtp = { path = "../../codec/v2gtp" }
homeplug = { path = "../../codec/homeplug" }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
iso15118-20 = { path = "../../codec/iso15118-20" }
evse-core = { path = "../../evse/core" }
control-pilot = { path = "../../pilot" }
din70121 = { path = "../../codec/din70121" }
iso15118-2 = { path = "../../codec/iso15118-2" }
app-protocol = { path = "../../codec/app-protocol" }
exi = { path = "../../codec/exi" }
toml = "1"
schemars = "1"
sim-control = { path = "../control" }
serde_json = "1"
# For the `evse-sim` command only: the TLS profile and the packet socket of the Linux adapter.
evcc-linux = { path = "../../evcc/linux" }
openssl = "0.10"

[[bin]]
name = "evse-sim"
path = "src/main.rs"
