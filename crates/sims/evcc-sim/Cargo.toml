[package]
name = "evcc-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "A simulated vehicle (EVCC with a fake battery) for tests, scenarios and interop runs"

[dependencies]
evcc-core = { path = "../../evcc/core" }
evcc-linux = { path = "../../evcc/linux" }
control-pilot = { path = "../../pilot" }
iso15118-20 = { path = "../../codec/iso15118-20" }
v2gtp = { path = "../../codec/v2gtp" }

sim-control = { path = "../control" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
schemars = "1"

[[bin]]
name = "evcc-sim"
path = "src/main.rs"
