[package]
name = "evse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sans-IO EVSE (SECC) side of ISO 15118-20: the charger's session machine behind the `Secc` trait."

[features]
# The same as `evcc-core`: what is compiled in; additive; `strict` rejects the combinations that cannot exist.
default = ["iso20", "iso2", "din", "slac", "ac", "dc"]
iso20 = []
iso2 = ["plug", "dep:iso15118-2"]
din = ["plug", "dc", "dep:din70121"]
ac = []
dc = []
plug = []
slac = ["plug", "dep:homeplug"]
inverted-pantograph = []
acdp = ["iso20", "dc", "inverted-pantograph"]
strict = []

[dependencies]
homeplug = { path = "../../codec/homeplug", optional = true }
v2gtp = { path = "../../codec/v2gtp" }
iso15118-20 = { path = "../../codec/iso15118-20" }
app-protocol = { path = "../../codec/app-protocol" }
exi = { path = "../../codec/exi" }
control-pilot = { path = "../../pilot" }
din70121 = { path = "../../codec/din70121", optional = true }
iso15118-2 = { path = "../../codec/iso15118-2", optional = true }

[dev-dependencies]
# the tests exercise everything, including ACDP
evse-core = { path = ".", features = ["acdp"] }
evcc-core = { path = "../../evcc/core", features = ["acdp"] }
