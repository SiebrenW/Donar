[package]
name = "evcc-linux"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["tls"]
# TLS, certificates and Plug & Charge signatures (OpenSSL). Without it: SDP, SLAC and the modem driver.
tls = ["dep:openssl", "dep:x509-parser"]

[dependencies]
evcc-core = { path = "../core" }
openssl = { version = "0.10", optional = true }
x509-parser = { version = "0.18", optional = true }
libc = "0.2"
v2gtp = { path = "../../codec/v2gtp" }
iso15118-20 = { path = "../../codec/iso15118-20" }
iso15118-2 = { path = "../../codec/iso15118-2" }
homeplug = { path = "../../codec/homeplug" }
exi = { path = "../../codec/exi" }
control-pilot = { path = "../../pilot" }
