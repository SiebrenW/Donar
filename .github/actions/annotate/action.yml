name: Annotate failures
description: Puts the lines of ci.log that say what failed into annotations (readable without the full log, through the API too).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        [ -f ci.log ] || exit 0
        # GitHub keeps ten error annotations per step: the first panic with the lines after it (what the failure says) goes
        # first, as one annotation, then the names of the failing tests and the compiler and clippy errors.
        n=$(grep -n -m1 'panicked at' ci.log | cut -d: -f1)
        if [ -n "$n" ]; then
          detail=$(sed -n "${n},$((n+25))p" ci.log | cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=First panic::${detail}"
        fi
        grep -E '^test .* \.\.\. FAILED|^error(\[|:)|^FAIL |^ERROR ' ci.log | head -8 | while IFS= read -r line; do
          echo "::error::$(printf '%s' "$line" | cut -c1-300)"
        done
